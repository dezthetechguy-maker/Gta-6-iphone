name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcode-select -p
          python --version
          git lfs version

      - name: Install macOS build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config
          brew link libtool --overwrite

      - name: Build Kivy iOS project
        shell: bash
        run: |
          set -o pipefail
          chmod +x build_ios.sh
          ./build_ios.sh 2>&1 | tee "$RUNNER_TEMP/ios-build.log"

      - name: Locate and inspect generated Xcode project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="${KIVY_IOS_PROJECT_FILE:-}"
          PROJECT_DIR="${KIVY_IOS_PROJECT_DIR:-}"
          if [ -z "$PROJECT_FILE" ] || [ ! -f "$PROJECT_FILE/project.pbxproj" ]; then
            echo 'ERROR: Generated Xcode project was not found.'
            find "$GITHUB_WORKSPACE/.." -maxdepth 3 -name '*.xcodeproj' -print || true
            exit 1
          fi
          test -f "$GITHUB_WORKSPACE/main.py"
          test -f "$GITHUB_WORKSPACE/main_ios.py"
          test -d "$GITHUB_WORKSPACE/assets"
          xcodebuild -list -project "$PROJECT_FILE" | tee "$RUNNER_TEMP/xcode-list.log"
          echo "KIVY_IOS_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "KIVY_IOS_PROJECT_FILE=$PROJECT_FILE" >> "$GITHUB_ENV"

      - name: Select the application target
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="$KIVY_IOS_PROJECT_FILE"

          # Kivy-ios exposes the app as a normal Xcode target. Do not use
          # PRODUCT_TYPE from -showBuildSettings here: PRODUCT_TYPE is not
          # guaranteed to be emitted by xcodebuild for every generated target.
          TARGETS="$(xcodebuild -list -project "$PROJECT_FILE" | awk '
            /^Targets:/{inside=1; next}
            /^Build Configurations:/{inside=0}
            inside && NF {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "")
              print
            }
          ')"

          echo 'Detected Xcode targets:'
          printf '%s\n' "$TARGETS"

          TARGET=''
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue
            if [ "$candidate" = 'gta6_iphone' ]; then
              TARGET="$candidate"
              break
            fi
          done <<EOF
          $TARGETS
          EOF

          # Fall back to the only target when Kivy-ios generated a different
          # name. This also keeps the workflow resilient to harmless naming changes.
          if [ -z "$TARGET" ]; then
            TARGET_COUNT="$(printf '%s\n' "$TARGETS" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
            if [ "$TARGET_COUNT" = '1' ]; then
              TARGET="$(printf '%s\n' "$TARGETS" | sed '/^[[:space:]]*$/d' | head -n 1)"
            fi
          fi

          if [ -z "$TARGET" ]; then
            echo 'ERROR: Could not identify the Kivy application target.'
            xcodebuild -list -project "$PROJECT_FILE"
            exit 1
          fi

          echo "KIVY_IOS_TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Selected application target: $TARGET"

      - name: Build unsigned iOS device app with Xcode
        shell: bash
        run: |
          set -o pipefail
          BUILD_OUTPUT_DIR="$RUNNER_TEMP/gta6-xcode-build"
          rm -rf "$BUILD_OUTPUT_DIR"
          mkdir -p "$BUILD_OUTPUT_DIR"

          xcodebuild \
            -project "$KIVY_IOS_PROJECT_FILE" \
            -scheme "$KIVY_IOS_TARGET" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$BUILD_OUTPUT_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcode-build.log"

      - name: Verify built app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/gta6-xcode-build" -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo 'ERROR: Xcode completed without producing an .app bundle.'
            find "$RUNNER_TEMP/gta6-xcode-build" -maxdepth 4 -print || true
            exit 1
          fi

          test -f "$APP_PATH/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          test -n "$EXECUTABLE"
          test -f "$APP_PATH/$EXECUTABLE"
          test -f "$APP_PATH/main.pyc"

          echo "Built app: $APP_PATH"
          echo "Executable: $EXECUTABLE"
          du -sh "$APP_PATH"
          echo "KIVY_IOS_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA_ROOT="$RUNNER_TEMP/ipa"
          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload"
          cp -R "$KIVY_IOS_APP_PATH" "$IPA_ROOT/Payload/"
          cd "$IPA_ROOT"
          /usr/bin/zip -qry "$RUNNER_TEMP/gta6_iphone-unsigned.ipa" Payload
          test -f "$RUNNER_TEMP/gta6_iphone-unsigned.ipa"
          ls -lh "$RUNNER_TEMP/gta6_iphone-unsigned.ipa"

      - name: Package Xcode project and build logs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          tar -czf "$RUNNER_TEMP/artifacts/gta6_ios_xcode_project.tar.gz" \
            -C "$(dirname "$KIVY_IOS_PROJECT_DIR")" \
            "$(basename "$KIVY_IOS_PROJECT_DIR")" \
            -C "$GITHUB_WORKSPACE" dist
          cp "$RUNNER_TEMP/ios-build.log" "$RUNNER_TEMP/artifacts/ios-build.log" || true
          cp "$RUNNER_TEMP/xcode-build.log" "$RUNNER_TEMP/artifacts/xcode-build.log" || true

      - name: Upload iOS build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-ios-build
          path: |
            ${{ runner.temp }}/gta6_iphone-unsigned.ipa
            ${{ runner.temp }}/artifacts/gta6_ios_xcode_project.tar.gz
            ${{ runner.temp }}/artifacts/ios-build.log
            ${{ runner.temp }}/artifacts/xcode-build.log
          if-no-files-found: error

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/diagnostics"
          {
            echo '===== XCODE ====='
            xcodebuild -version
            echo '===== PYTHON ====='
            python --version
            python -m pip show kivy-ios Cython packaging
            echo '===== PROJECT ====='
            printf 'Project: %s\nTarget: %s\n' "${KIVY_IOS_PROJECT_FILE:-<unset>}" "${KIVY_IOS_TARGET:-<unset>}"
            echo '===== KIVY LOG (LAST 250) ====='
            tail -n 250 "$RUNNER_TEMP/ios-build.log" 2>/dev/null
            echo '===== XCODE LIST (LAST 150) ====='
            tail -n 150 "$RUNNER_TEMP/xcode-list.log" 2>/dev/null
            echo '===== XCODE BUILD LOG (LAST 350) ====='
            tail -n 350 "$RUNNER_TEMP/xcode-build.log" 2>/dev/null
          } | tee "$RUNNER_TEMP/diagnostics/failure-diagnostics.txt"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-ios-failure-diagnostics
          path: |
            ${{ runner.temp }}/diagnostics/failure-diagnostics.txt
            ${{ runner.temp }}/ios-build.log
            ${{ runner.temp }}/xcode-list.log
            ${{ runner.temp }}/xcode-build.log
          if-no-files-found: ignore
