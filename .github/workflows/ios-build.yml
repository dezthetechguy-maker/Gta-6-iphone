name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Show build environment
        run: |
          set -e
          sw_vers
          xcodebuild -version
          xcode-select -p
          python --version
          git lfs version

      - name: Install macOS build dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config
          brew link libtool --overwrite

      - name: Build Kivy iOS project
        shell: bash
        run: |
          set -o pipefail
          chmod +x build_ios.sh
          ./build_ios.sh 2>&1 | tee ios-build.log

      - name: Verify generated project contains the app source
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find . -maxdepth 1 -type d -name '*-ios' -print -quit)"
          if [ -z "$PROJECT_DIR" ]; then
            echo 'No generated *-ios project directory found.'
            exit 1
          fi
          test -f main.py
          test -f main_ios.py
          test -d assets
          test -f "$PROJECT_DIR/gta6_iphone.xcodeproj/project.pbxproj"
          echo "Project: $PROJECT_DIR"
          echo 'Source files and Xcode project are present.'

      - name: Create shared Xcode scheme
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find . -maxdepth 1 -type d -name '*-ios' -print -quit)"
          PROJECT_FILE="$PROJECT_DIR/gta6_iphone.xcodeproj"
          PBX_FILE="$PROJECT_FILE/project.pbxproj"
          TARGET_ID="$(grep -E '^[[:space:]]*[A-Fa-f0-9]+ /\\* gta6_iphone \\*/ = \\{' "$PBX_FILE" | sed -E 's/^[[:space:]]*([A-Fa-f0-9]+).*/\\1/' | head -n 1)"
          if [ -z "$TARGET_ID" ]; then
            echo 'Could not find the gta6_iphone native target in project.pbxproj.'
            exit 1
          fi
          SCHEME_DIR="$PROJECT_FILE/xcshareddata/xcschemes"
          mkdir -p "$SCHEME_DIR"
          cat > "$SCHEME_DIR/gta6_iphone.xcscheme" <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<Scheme LastUpgradeVersion="1600" version="1.3">
  <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
    <BuildActionEntries>
      <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
        <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$TARGET_ID" BuildableName="gta6_iphone.app" BlueprintName="gta6_iphone" ReferencedContainer="container:gta6_iphone.xcodeproj"/>
      </BuildActionEntry>
    </BuildActionEntries>
  </BuildAction>
  <TestAction buildConfiguration="Debug" shouldUseLaunchSchemeArgsEnv="YES"/>
  <LaunchAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" allowLocationSimulation="YES">
    <BuildableProductRunnable runnableDebuggingMode="0">
      <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$TARGET_ID" BuildableName="gta6_iphone.app" BlueprintName="gta6_iphone" ReferencedContainer="container:gta6_iphone.xcodeproj"/>
    </BuildableProductRunnable>
  </LaunchAction>
  <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgsEnv="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES">
    <BuildableProductRunnable runnableDebuggingMode="0">
      <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$TARGET_ID" BuildableName="gta6_iphone.app" BlueprintName="gta6_iphone" ReferencedContainer="container:gta6_iphone.xcodeproj"/>
    </BuildableProductRunnable>
  </ProfileAction>
  <AnalyzeAction buildConfiguration="Debug"/>
  <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"/>
</Scheme>
EOF
          echo "Created shared scheme for target $TARGET_ID"
          xcodebuild -list -project "$PROJECT_FILE"

      - name: Build unsigned iOS device app with Xcode
        shell: bash
        run: |
          set -o pipefail
          PROJECT_DIR="$(find . -maxdepth 1 -type d -name '*-ios' -print -quit)"
          PROJECT_FILE="$PROJECT_DIR/gta6_iphone.xcodeproj"
          rm -rf xcode-build
          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme gta6_iphone \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath xcode-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcode-build.log

      - name: Verify built app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find xcode-build -type d -name '*.app' -path '*Debug-iphoneos*' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo 'Xcode reported success but no iphoneos .app bundle was produced.'
            exit 1
          fi
          test -f "$APP_PATH/Info.plist"
          MAIN_PYC="$(find "$APP_PATH" -type f -name 'main.pyc' -print -quit)"
          if [ -z "$MAIN_PYC" ]; then
            echo 'Built app is missing main.pyc.'
            find "$APP_PATH" -maxdepth 3 -type f | head -n 100
            exit 1
          fi
          echo "Built app: $APP_PATH"
          echo "Python entrypoint: $MAIN_PYC"
          du -sh "$APP_PATH"

      - name: Package generated Xcode project and unsigned app
        if: success()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PROJECT_DIR="$(find . -maxdepth 1 -type d -name '*-ios' -print -quit)"
          APP_PATH="$(find xcode-build -type d -name '*.app' -path '*Debug-iphoneos*' -print -quit)"
          if [ -z "$PROJECT_DIR" ] || [ -z "$APP_PATH" ]; then
            echo 'Required build outputs are missing.'
            exit 1
          fi
          tar -czf artifacts/gta6_ios_build.tar.gz "$PROJECT_DIR" dist xcode-build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-ios-build
          path: artifacts/gta6_ios_build.tar.gz
          if-no-files-found: error

      - name: Print useful failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          {
            echo '===== XCODE ====='
            xcodebuild -version
            echo '===== PYTHON ====='
            python --version
            echo '===== TOOLCHAIN ====='
            .venv/bin/toolchain recipes --compact 2>&1
            echo '===== KIVY BUILD LOG (LAST 200) ====='
            tail -n 200 ios-build.log 2>/dev/null
            echo '===== XCODE BUILD LOG (LAST 300) ====='
            tail -n 300 xcode-build.log 2>/dev/null
          } | tee diagnostics/failure-diagnostics.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            diagnostics/failure-diagnostics.txt
            ios-build.log
            xcode-build.log
          if-no-files-found: ignore
